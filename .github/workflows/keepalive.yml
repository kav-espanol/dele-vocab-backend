# Render 무료 서버가 잠들지 않도록 5분마다 /api/health 를 불러 깨워 둡니다.
name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping server
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://vocabulario-esp.onrender.com/api/health
